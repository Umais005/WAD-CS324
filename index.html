<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAD-CS324</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 40px;
            color: #2c3e50;
        }

        .card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            padding: 40px;
            text-align: center;
            max-width: 350px;
            width: 90%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #34495e;
        }

        .card p {
            color: #7f8c8d;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .card a {
            display: inline-block;
            background-color: #3498db;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        .card a:hover {
            background-color: #2980b9;
        }
    </style>
</head>

<body>

    <h1>WAD-CS324</h1>

    <div class="card">
        <h2>Assignment 2</h2>
        <p>Access assignment 2 pagebelow.</p>
        <a href="./Assignment-2/index.html">Launch Assignment 2</a>
    </div>

</body>

</html>
